<tui-root>
    <main class="page">
        <header class="toolbar">
            <div>
                <h1 tuiTitle>
                    Планировщик путешествий
                    <span tuiSubtitle>Два последовательных онбординга на ngx-ui-tour</span>
                </h1>
            </div>

            <button
                appearance="outline"
                size="m"
                tuiButton
                type="button"
                [disabled]="running() || (!travelNotesTour && !tripPlanningTour)"
                (click)="startTours(true)"
            >
                Запустить оба онбординга
            </button>
        </header>

        <div class="workspace" [class.sidebar-open]="sidebar.opened()">
            <section class="grid-shell">
                <div class="grid-toolbar">
                    <span>Маршруты для будущих поездок</span>
                    <span>{{ rowData.length }} маршрутов</span>
                </div>

                <ag-grid-angular
                    class="ag-theme-quartz grid"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [rowData]="rowData"
                    [rowHeight]="48"
                    [theme]="'legacy'"
                    (firstDataRendered)="onFirstDataRendered()"
                    (gridReady)="onGridReady($event)"
                />
            </section>

            @if (sidebar.travelPlan(); as travelPlan) {
                <travel-notes-sidebar
                    [travelPlan]="travelPlan"
                    (closed)="closeSidebar()"
                />
            }
        </div>
    </main>

    @if (travelNotesTour || tripPlanningTour) {
        <tour-step-template>
            <ng-template let-step="step">
                <app-tour-template [step]="step" />
            </ng-template>
        </tour-step-template>
    }
</tui-root>
